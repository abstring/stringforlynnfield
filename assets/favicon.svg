<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Jillian String headshot favicon">
  <defs>
    <clipPath id="avatar">
      <rect x="4" y="4" width="56" height="56" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="#0b1b3f" stroke="#d4a24c" stroke-width="2.5"/>
  <image
    href="jillian-headshot.png"
    x="4"
    y="4"
    width="56"
    height="56"
    preserveAspectRatio="xMidYMin slice"
    clip-path="url(#avatar)"
  />
  <rect x="4.8" y="4.8" width="54.4" height="54.4" rx="11" ry="11" fill="none" stroke="#d4a24c" stroke-width="1.6"/>
</svg>
