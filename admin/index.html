<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decap CMS | Jillian String</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b1b3f;
        color: #ffffff;
        display: grid;
        place-items: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        background: #10203f;
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 24px 28px;
        border-radius: 12px;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
        max-width: 420px;
      }
      h1 {
        margin-bottom: 0.25rem;
        font-size: 1.6rem;
      }
      p {
        opacity: 0.9;
        line-height: 1.5;
        margin-bottom: 1.25rem;
      }
      .loading {
        font-weight: 700;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Admin loading…</h1>
      <p class="loading">Please wait while Decap CMS initializes.</p>
    </div>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
